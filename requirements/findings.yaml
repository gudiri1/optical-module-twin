# SPDX-License-Identifier: Apache-2.0
# Findings raised while building and verifying the module firmware.
# Each was found by a test or tool in this repository, not by inspection alone.
- id: F-001
  title: Spurious laser-temperature alarms on every power-up
  found_by: omt lint (L016) on a freshly brought-up module
  root_cause: Aux1/Aux2 (laser plate temperature, TEC drive) alarms were evaluated while the TEC was still settling in ModulePwrUp, so low alarms latched on every bring-up.
  fix: Evaluate Aux alarms only in ModuleReady (monitor.c). Regression test test_no_spurious_flags_after_bring_up.
  status: fixed
- id: F-002
  title: TX bias high alarm could never fire
  found_by: DVT fault matrix, laser end-of-life scenario
  root_cause: Bias high alarm threshold (110 mA) sat above the APC bias clamp (105 mA); a dying laser saturated silently.
  fix: Thresholds 100/90 mA (alarm/warning), consistency test test_thresholds_reachable_before_protection.
  status: fixed
- id: F-003
  title: Degrading laser hid its own TX alarms
  found_by: DVT fault matrix, laser end-of-life scenario
  root_cause: Lane alarms were gated on "APC converged"; a laser that loses convergence because it is failing dropped out of alarm evaluation.
  fix: Alarms arm on first convergence after enable and stay armed until the lane is disabled (tx.c, monitor.c).
  status: fixed
- id: F-004
  title: Latched-flag semantics after clear-on-read are a spec interpretation
  found_by: DVT temperature sweep (flag read ordering)
  root_cause: Whether a latched flag is set again while its condition persists after a read could not be confirmed from accessible sources. Default is edge-triggered (no interrupt storms); OMT_FLAGS_RELATCH=1 builds level-relatch.
  fix: Build option + documentation; confirm against the OIF-CMIS text before release.
  status: open
- id: F-005
  title: RX power DDM drifts +0.12 dB from 25 to 79 degC module temperature
  found_by: DVT temperature sweep data
  root_cause: Photodiode responsivity temperature coefficient is not compensated; calibration is single-temperature.
  fix: Within the +/-1 dB budget today. Option - add a tempco coefficient to the factory record and calibrate at two temperatures.
  status: accepted
- id: F-006
  title: Debug console printed stale SPI register values
  found_by: pytest test_console_commands
  root_cause: omt_printf(fmt, ld_read(..., &v) ? ... , reg, v) - C leaves argument evaluation order unspecified, so v was read before the SPI transfer.
  fix: Evaluate the transfer into rc first (console.c).
  status: fixed
- id: F-007
  title: Twin DSP model is ~0.2 dB optimistic vs. the equalized link
  found_by: dsplab Monte-Carlo (7-tap FFE + MM CDR)
  root_cause: Measured BER after FFE is ~1.2-1.3x the closed form at the measured SNR (residual ISI is not Gaussian, LMS misadjustment).
  fix: Accepted for system-level simulation; noted where sensitivity margins are quoted.
  status: accepted
- id: F-008
  title: Host-side Tx LOL flag was reported on the media lane bit
  found_by: Implementing per-host-lane SerDes supervision (REQ-SI-002) and reviewing Page 11h byte 137
  root_cause: The firmware derived Tx CDR LOL from one host-lock bit per media lane and latched it at bit l of the media lane. Page 11h host-side flags are per host lane, so an electrical fault on host lanes 5-6 (media lane 3) appeared as host lane 3 and the second lane of each pair was never reported. Tx LOS and Tx adaptive Eq fault were not reported at all.
  fix: The DSP reports lock, signal detect and adaptation per host lane; monitor.c latches Tx LOS, Tx CDR LOL and Tx adaptive Eq fault per host lane. test_host_lol_is_per_host_lane covers it.
  status: fixed
- id: F-009
  title: DSP reset released after ~10 ms instead of 20 ms
  found_by: Oscilloscope capture of the power-up sequence (dvt.power_sequencing_scope) - DSP_RSTN rose 9 ms after the DSP rail
  root_cause: The power-up steps timed their delays from entering ModulePwrUp (mstate_t). The rails are switched in step 0, which runs one msm period (10 ms) later, so the reset hold the bring-up guide specifies (20 ms after the rails) shrank to about 10 ms. No functional symptom in the twin; on hardware a DSP with a minimum reset-after-supply time could start from an undefined state.
  fix: Step 0 records the rail switch-on time and steps 1 and 2 count from it (msm.c). The scope procedure checks the hold time on every run.
  status: fixed
- id: F-010
  title: User EEPROM erased its flash sector on every host write
  found_by: Qualification, NVM wear projection in qual.power_cycling (1 erase per coalesced Page 03h write)
  root_cause: nvm_save_user_eeprom() erased sector 0x1000 and programmed one record each time. With 100k erase cycles a host writing Page 03h once a minute wears the sector out in about 10 weeks (once an hour in 11 years), and a power loss between erase and program loses the page.
  fix: Append-only log over two sectors used in turn (0x1000 and 0x5000, 29 records each); the other sector is erased only when one is full, so the newest copy is never being erased. Old single-record format is still read once after a firmware update. One write per hour now projects to 685 years, one per minute to 11 years. Unit test test_user_eeprom_wear_and_power_fail.
  status: fixed
- id: P-1
  title: "Review note for Zephyr PR #123842: monitor/id reads clear latched flags"
  found_by: tests/interop/test_pr_access_pattern.py (driver access pattern replayed against the twin)
  root_cause: cmis_module_read_monitors() reads lower memory 0..17 and read_id() reads 0..127 in one transfer. Bytes 8..11 are clear-on-read latched flags, so every call consumes ModuleStateChanged, CdbCmdComplete and Aux flags that the API does not return, and can release IntL before an interrupt handler runs.
  fix: "Fix prepared for #123842: read_id() reads bytes 0..7 and 85, read_monitors() byte 9 and 14..17; the Zephyr emulator now models clear-on-read and test_reads_keep_unreported_flags fails on the old driver."
  status: fix prepared
- id: P-2
  title: Page-select caching breaks with a second host agent
  found_by: tests/interop/test_pr_access_pattern.py::test_page_select_cache_hazard
  root_cause: A host that caches the page select reads the wrong page after another agent (for example the Zephyr `cmis info` shell command) selects Page 00h. The twin reproduces phantom RX LOL flags from part-number ASCII.
  fix: "Within one Zephyr image: per-device mutex across select and read in a prepared follow-up PR; test_concurrent_paged_reads fails without it (37 of 50 reads wrong). Across independent host agents the rule stays: one owner per module."
  status: fix prepared
- id: P-3
  title: "Review note for Zephyr PR #123842: power_class is the encoded value"
  found_by: interop field comparison
  root_cause: struct cmis_id.power_class holds bits 7..5 of byte 200 (0..7); CMIS names the classes 1..8. Callers may display "class 7" for a class 8 module.
  fix: "Fix prepared as fixup for #123842: class = encoded + 1, as ethtool prints it; test image corrected to class 8 for 14 W."
  status: fix prepared
- id: P-4
  title: Tx bias scaling factor direction differs between implementations
  found_by: Implementing Page 01h byte 160 for the follow-up PR, compared with ethtool cmis.c
  root_cause: ethtool right-shifts the raw bias value by the code; the follow-up PR multiplies the 2 uA LSB by x1/x2/x4. The OIF text was not accessible here.
  fix: Stated as an open question in the follow-up PR description; one-line change plus tests either way.
  status: open
